<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | EnvBoot</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      (function() {
        var path = window.location.pathname;
        var repo = '/envboot';
        if (path.indexOf(repo) === 0) {
          path = path.slice(repo.length);
        }
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        
        if (path && path !== '/' && path !== '/index.html') {
          window.location.replace(repo + '/#' + path + search + hash);
        } else {
          window.location.replace(repo + '/#/404' + search + hash);
        }
      })();
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #09090b;
        color: #f4f4f5;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .container {
        max-width: 480px;
        padding: 24px;
      }
      h1 { font-size: 2rem; margin: 0 0 8px; font-weight: 700; letter-spacing: -0.02em; }
      p { font-size: 0.95rem; color: #a1a1aa; line-height: 1.5; margin: 0 0 20px; }
      a {
        display: inline-block;
        padding: 10px 20px;
        background: #ffffff;
        color: #09090b;
        text-decoration: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Page Not Found</h1>
      <p>Redirecting to EnvBoot documentation...</p>
      <a href="./#/docs/quickstart">Return to Docs</a>
    </div>
  </body>
</html>
