<!doctype html>
<html lang="en" class="dark preload">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('envboot-theme') || 'dark';
          var root = document.documentElement;
          if (saved === 'light') {
            root.classList.remove('dark');
            root.classList.add('light');
          } else {
            root.classList.add('dark');
            root.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2371717a%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z%22/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Zero-runtime-dependency environment contract and validation tool for JavaScript and TypeScript projects. Automated AST detection, CI drift protection, and zero runtime overhead." />
    <meta name="keywords" content="envboot, environment contract, env validation, dotenv alternative, zod env, zero dependencies, nodejs, bun, deno, typescript, github actions ci" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Ashish Ranjan & EnvBoot Contributors" />
    
    <!-- Theme Color for Mobile Browser Chrome -->
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EnvBoot" />
    <meta property="og:title" content="EnvBoot — Zero-Dependency Environment Contract & Validation" />
    <meta property="og:description" content="Catch missing environment variables before your server starts or client mounts. Automated AST detection, CI drift protection, and zero runtime bloat." />
    <meta property="og:url" content="https://ashishrbuilds.github.io/envboot" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EnvBoot — Zero-Dependency Environment Contract & Validation" />
    <meta name="twitter:description" content="Catch missing environment variables before your server starts or client mounts. Automated AST detection, CI drift protection, and zero runtime bloat." />
    <meta name="twitter:creator" content="@ashishrbuilds" />

    <title>EnvBoot — Zero-Dependency Environment Contract & Validation</title>
  </head>

</html>
