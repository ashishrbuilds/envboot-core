<!doctype html>
<html lang="en" class="dark preload">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('envboot-theme');
          var mode = (saved === 'light' || saved === 'dark') ? saved : 'auto';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode === 'auto' && prefersDark);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/envboot.png" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM Context" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Zero-runtime-dependency environment contract and validation tool for JavaScript and TypeScript projects. Automated AST detection, CI drift protection, and zero runtime overhead." />
    <meta name="keywords" content="envboot, environment contract, env validation, dotenv alternative, zod env, zero dependencies, nodejs, bun, deno, typescript, github actions ci" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Ashish Ranjan & EnvBoot Contributors" />
    
    <!-- Theme Color for Mobile Browser Chrome -->
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
